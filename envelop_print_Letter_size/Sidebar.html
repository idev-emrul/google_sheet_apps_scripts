<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; margin: 8px; color: #202124; }
    h3 { margin: 8px 0 4px; font-size: 13px; }
    label { display: block; margin: 6px 0 2px; font-weight: bold; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: 4px; }
    textarea { height: 78px; resize: vertical; }
    .row { display: flex; gap: 6px; }
    .row > div { flex: 1; }
    button { width: 100%; padding: 8px; margin-top: 8px; border: 0; border-radius: 4px;
             background: #1a73e8; color: #fff; font-weight: bold; cursor: pointer; }
    button.secondary { background: #5f6368; }
    #status { margin-top: 8px; font-size: 12px; white-space: pre-wrap; }
    a { color: #1a73e8; }
    hr { border: none; border-top: 1px solid #e0e0e0; margin: 10px 0; }
  </style>
</head>
<body>
  <h3>Envelope size (mm)</h3>
  <label>Preset</label>
  <select id="preset" onchange="applyPreset()">
    <option value="241,105">#10 business (241 × 105)</option>
    <option value="220,110">DL (220 × 110)</option>
    <option value="229,162">C5 (229 × 162)</option>
    <option value="162,114">C6 (162 × 114)</option>
    <option value="custom">Custom…</option>
  </select>
  <div class="row">
    <div><label>Width</label><input id="widthMm" type="number" step="1"></div>
    <div><label>Height</label><input id="heightMm" type="number" step="1"></div>
  </div>

  <hr>
  <h3>Layout (mm)</h3>
  <div class="row">
    <div><label>Margin</label><input id="marginMm" type="number" step="1"></div>
    <div><label>Font (pt)</label><input id="fontSize" type="number" step="1"></div>
  </div>
  <div class="row">
    <div><label>Recipient left</label><input id="recipientLeftMm" type="number" step="1"></div>
    <div><label>Recipient top</label><input id="recipientTopMm" type="number" step="1"></div>
  </div>

  <hr>
  <label>From block (one line each)</label>
  <textarea id="fromText"></textarea>

  <hr>
  <h3>Rows</h3>
  <div class="row">
    <div><label>Start</label><input id="startRow" type="number" step="1" min="1"></div>
    <div><label>End (0=all)</label><input id="endRow" type="number" step="1" min="0"></div>
  </div>

  <button class="secondary" onclick="run('preview')">Preview first 3</button>
  <button onclick="run('generate')">Generate PDF</button>

  <div id="status"></div>

  <script>
    const FIELDS = ['widthMm','heightMm','marginMm','fontSize',
                    'recipientLeftMm','recipientTopMm','startRow','endRow'];

    function load() {
      google.script.run.withSuccessHandler(cfg => {
        FIELDS.forEach(f => document.getElementById(f).value = cfg[f]);
        document.getElementById('fromText').value = cfg.fromText;
      }).getSettings();
    }

    function collect() {
      const cfg = {};
      FIELDS.forEach(f => cfg[f] = Number(document.getElementById(f).value));
      cfg.fromText = document.getElementById('fromText').value;
      return cfg;
    }

    function applyPreset() {
      const v = document.getElementById('preset').value;
      if (v === 'custom') return;
      const [w, h] = v.split(',');
      document.getElementById('widthMm').value = w;
      document.getElementById('heightMm').value = h;
    }

    function run(mode) {
      const s = document.getElementById('status');
      s.textContent = 'Working… (large runs take a minute)';
      const cfg = collect();
      const fn = mode === 'preview' ? 'previewEnvelopes' : 'generateEnvelopes';
      google.script.run
        .withSuccessHandler(res => {
          if (mode === 'preview') {
            s.innerHTML = 'Preview (' + res.count + ' rows): ' +
              '<a href="' + res.url + '" target="_blank">open Doc</a>';
          } else {
            s.innerHTML = 'Done — ' + res.count + ' envelopes.<br>' +
              '<a href="' + res.pdfUrl + '" target="_blank">Open PDF</a> · ' +
              '<a href="' + res.docUrl + '" target="_blank">Open Doc</a><br>' +
              'Print with Scale = 100% / Actual size.';
          }
        })
        .withFailureHandler(err => { s.textContent = 'Error: ' + err.message; })
        [fn](cfg);
    }

    load();
  </script>
</body>
</html>
